<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đã gửi thư | EV Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #198754 0%, #212529 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .auth-card { background: white; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; max-width: 400px; overflow: hidden; }
    </style>
</head>
<body>

<div class="auth-card text-center">
    <div class="card-body p-5">
        <i class="bi bi-envelope-paper-heart text-success" style="font-size: 4rem;"></i>
        <h4 class="fw-bold mt-3 mb-2 text-dark">Kiểm tra Hòm thư</h4>
        <p class="text-muted small">Chúng tôi đã gửi email hướng dẫn tạo mật khẩu mới. Nếu không thấy, vui lòng kiểm tra thư mục Spam / Thư rác trên Mailtrap của bạn.</p>
        
        <a href="{% url 'login' %}" class="btn btn-outline-success w-100 mt-3 py-2 fw-bold">Về trang Đăng nhập</a>
    </div>
</div>

</body>
</html>
