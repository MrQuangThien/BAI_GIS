
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ trạm sạc xe điện</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Routing Machine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        body { margin: 0; background: #f5f5f5; }
        #map { height: calc(100vh - 180px); }
        .top-panel {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }
        .route-btn {
            background: #198754;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .route-btn:hover { background: #146c43; }
    </style>
</head>
<body>

<div class="container-fluid p-3">
    <div class="top-panel mb-3">
        <h5>⚡ Bản đồ trạm sạc xe điện</h5>
        <p id="status" class="fw-bold text-danger mb-2">Đang tải dữ liệu...</p>

        <div class="row g-2">
            <div class="col-md-4">
                <label class="form-label">Bán kính tìm kiếm</label>
                <select id="radius" class="form-select form-select-sm">
                    <option value="1000">1 km</option>
                    <option value="3000">3 km</option>
                    <option value="5000" selected>5 km</option>
                    <option value="10000">10 km</option>
                </select>
            </div>

            <div class="col-md-8">
                <strong>Trạm gần nhất:</strong> <span id="tram-name">-</span><br>
                Khoảng cách: <span id="distance">-</span><br>
                Địa chỉ: <span id="tram-address">-</span>
            </div>
        </div>

        <button class="route-btn mt-3" onclick="openGoogleMaps()">
            🚗 Mở Google Maps chỉ đường
        </button>
    </div>
</div>

<div id="map"></div>

<script>
    let map, userLat, userLon, routingControl, radiusCircle;
    let tramMarkers = [];
    let allTrams = [];
    let selectedTram = null;

    // Khởi tạo bản đồ
    map = L.map('map').setView([10.8231, 106.6297], 12); // Trung tâm TP.HCM

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Load dữ liệu trạm trước, sau đó mới lấy vị trí người dùng
    fetch("{% url 'tram_api' %}")
        .then(res => {
            if (!res.ok) throw new Error('Lỗi tải dữ liệu trạm: ' + res.status);
            return res.json();
        })
        .then(data => {
            allTrams = data || [];
            console.log(`Đã tải ${allTrams.length} trạm`);

            document.getElementById('status').textContent = "Đang lấy vị trí...";

            navigator.geolocation.getCurrentPosition(success, error, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById('status').textContent = "Lỗi tải trạm: " + err.message;
        });

    function success(pos) {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;

        document.getElementById('status').textContent = "Đã xác định vị trí";

        L.marker([userLat, userLon]).addTo(map)
            .bindPopup("📍 Bạn đang ở đây")
            .openPopup();

        map.setView([userLat, userLon], 13);

        drawRadius();
        renderTrams();
    }

    function error(err) {
        document.getElementById('status').textContent = "Không lấy được vị trí → hiển thị tất cả trạm";
        renderAllTramsWithoutFilter();
    }

    function renderTrams() {
        tramMarkers.forEach(m => m.remove());
        tramMarkers = [];

        const radius = parseInt(document.getElementById("radius").value) || 5000;

        allTrams.forEach(tram => {
            if (!tram.lat || !tram.lon) return;

            const dist = map.distance([userLat, userLon], [tram.lat, tram.lon]);

            if (dist <= radius) {
                const marker = L.marker([tram.lat, tram.lon])
                    .addTo(map)
                    .bindPopup(`
                        <b>${tram.ten_tram}</b><br>
                        ${tram.dia_chi || 'Chưa cập nhật địa chỉ'}<br>
                        ${(dist/1000).toFixed(2)} km
                    `);

                marker.on('click', () => {
                    selectedTram = tram;
                    drawRoute(tram);
                    updateInfo(tram, dist);
                });

                tramMarkers.push(marker);
            }
        });
    }

    function renderAllTramsWithoutFilter() {
        allTrams.forEach(tram => {
            if (!tram.lat || !tram.lon) return;
            L.marker([tram.lat, tram.lon])
                .addTo(map)
                .bindPopup(`<b>${tram.ten_tram}</b><br>${tram.dia_chi || 'Chưa cập nhật'}`);
        });
    }

    function drawRadius() {
        if (radiusCircle) radiusCircle.remove();
        const r = parseInt(document.getElementById("radius").value) || 5000;

        radiusCircle = L.circle([userLat, userLon], {
            radius: r,
            color: "#0d6efd",
            fillColor: "#0d6efd",
            fillOpacity: 0.15
        }).addTo(map);
    }

    document.getElementById("radius").addEventListener("change", () => {
        if (userLat && userLon) {
            drawRadius();
            renderTrams();
        }
    });

    function drawRoute(tram) {
        if (routingControl) routingControl.remove();

        routingControl = L.Routing.control({
            waypoints: [L.latLng(userLat, userLon), L.latLng(tram.lat, tram.lon)],
            routeWhileDragging: false,
            show: false,
            addWaypoints: false,
            draggableWaypoints: false,
            fitSelectedRoutes: true
        }).addTo(map);
    }

    function updateInfo(tram, dist) {
        document.getElementById('tram-name').textContent = tram.ten_tram || '-';
        document.getElementById('tram-address').textContent = tram.dia_chi || '-';
        document.getElementById('distance').textContent = 
            (typeof dist === 'number') ? (dist/1000).toFixed(2) + ' km' : '-';
    }

    function openGoogleMaps() {
        if (!selectedTram || !userLat || !userLon) {
            alert("Chưa chọn trạm hoặc chưa có vị trí!");
            return;
        }
        const url = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${selectedTram.lat},${selectedTram.lon}&travelmode=driving`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
