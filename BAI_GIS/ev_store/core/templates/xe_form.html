<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | EV Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { background-color: #212529; min-height: 100vh; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #198754; color: white; border-radius: 5px; margin: 0 10px; }
        .action-btn { font-size: 0.85rem; padding: 5px 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar shadow-lg">
            <h4 class="text-center text-success fw-bold mb-4"><i class="bi bi-lightning-charge-fill"></i> EV STORE</h4>
            <a href="/core/dashboard/"><i class="bi bi-speedometer2 me-2"></i> Tổng quan</a>
            <a href="/core/quan-ly-tram-sac/"><i class="bi bi-ev-station me-2"></i> Quản lý Trạm Sạc</a>
            <a href="/core/danh_sach_xe" class="active"><i class="bi bi-car-front me-2"></i> Quản lý Xe Điện</a>
            <a href="/core/users/"><i class="bi bi-person me-2"></i> Quản lý Người Dùng</a>
            <a href="/core/map/" target="_blank"><i class="bi bi-map me-2"></i> Xem Bản Đồ</a>
        </div>

        <div class="col-md-10 p-4">
            
            <div class="row justify-content-center mt-2">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>{{ title }}</h5>
                        </div>
                        <div class="card-body p-4">
                            <form method="POST">
                                {% csrf_token %}
                                
                                {% for field in form %}
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">{{ field.label }}</label>
                                        {{ field }}
                                        {% if field.errors %}
                                            <div class="text-danger small mt-1"><i class="bi bi-exclamation-circle me-1"></i>{{ field.errors }}</div>
                                        {% endif %}
                                    </div>
                                {% endfor %}

                                <div class="mt-4 text-end">
                                    <a href="{% url 'danh_sach_xe' %}" class="btn btn-secondary me-2">
                                        <i class="bi bi-x-circle me-1"></i>Hủy bỏ
                                    </a>
                                    <button type="submit" class="btn btn-success fw-bold">
                                        <i class="bi bi-save me-1"></i>Lưu dữ liệu
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
