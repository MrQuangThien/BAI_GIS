{% extends 'base_admin.html' %}

{% block title %}Xóa Xe | EV STORE{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger rounded-3">
            <div class="card-body text-center p-5">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                <h3 class="fw-bold mt-3">Xác nhận xóa xe</h3>
                <p class="text-muted fs-5 mt-3">Bạn có chắc chắn muốn xóa xe <strong>"{{ xe.ten_xe }}"</strong> khỏi hệ thống không?</p>
                <div class="alert alert-danger">Hành động này không thể hoàn tác!</div>
                
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'danh_sach_xe' %}" class="btn btn-secondary me-2 px-4">Hủy</a>
                    <button type="submit" class="btn btn-danger px-4">Xác nhận Xóa</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
