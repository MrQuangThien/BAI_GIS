<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Xóa | EV Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { background-color: #212529; min-height: 100vh; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #198754; color: white; border-radius: 5px; margin: 0 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar shadow-lg">
            <h4 class="text-center text-success fw-bold mb-4"><i class="bi bi-lightning-charge-fill"></i> EV STORE</h4>
            <a href="/core/dashboard/"><i class="bi bi-speedometer2 me-2"></i> Tổng quan</a>
            <a href="/core/quan-ly-tram-sac/"><i class="bi bi-ev-station me-2"></i> Quản lý Trạm Sạc</a>
            <a href="/core/danh_sach_xe" class="active"><i class="bi bi-car-front me-2"></i> Quản lý Xe Điện</a>
            <a href="/core/users/"><i class="bi bi-person me-2"></i> Quản lý Người Dùng</a>
            <a href="/core/map/" target="_blank"><i class="bi bi-map me-2"></i> Xem Bản Đồ</a>
        </div>

        <div class="col-md-10 p-4">
            
            <div class="row justify-content-center mt-5">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg border-0 border-top border-danger border-4 rounded-3">
                        <div class="card-body p-5 text-center">
                            
                            <div class="mb-4">
                                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                            </div>

                            <h3 class="text-danger fw-bold mb-3">Cảnh báo xóa dữ liệu!</h3>
                            
                            <p class="fs-5 text-secondary">
                                Bạn có chắc chắn muốn xóa xe <br>
                                <strong class="text-dark fs-4">{{ xe.ten_xe }}</strong>?
                            </p>
                            
                            <p class="text-muted small mb-4 px-3">
                                <i class="bi bi-info-circle me-1"></i> Hành động này không thể hoàn tác và toàn bộ dữ liệu liên quan sẽ bị xóa vĩnh viễn.
                            </p>
                            
                            <form method="POST" class="d-flex justify-content-center gap-3">
                                {% csrf_token %}
                                <a href="{% url 'danh_sach_xe' %}" class="btn btn-outline-secondary px-4 fw-semibold">
                                    <i class="bi bi-arrow-return-left me-1"></i> Quay lại
                                </a>
                                <button type="submit" class="btn btn-danger px-4 fw-bold shadow-sm">
                                    <i class="bi bi-trash me-1"></i> Đồng ý xóa
                                </button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
