<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt mật khẩu mới | EV Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #198754 0%, #212529 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .auth-card { background: white; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; max-width: 420px; overflow: hidden; }
        .auth-header { background: #198754; color: white; padding: 25px 20px; text-align: center; }
        .btn-success { background-color: #198754; border: none; }
        
        /* Chỉnh CSS để form mặc định của Django đẹp chuẩn Bootstrap */
        .django-form p { text-align: left; margin-bottom: 15px; }
        .django-form label { display: block; font-size: 0.8em; font-weight: bold; color: #6c757d; text-transform: uppercase; margin-bottom: 5px; }
        .django-form input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #ced4da; border-radius: 6px; }
        .django-form input:focus { border-color: #198754; outline: 0; box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); }
        .django-form ul.errorlist { color: #dc3545; font-size: 0.85em; list-style: none; padding-left: 0; text-align: left; margin-top: 5px; }
        .django-form .helptext { display: block; font-size: 0.75em; color: #adb5bd; margin-top: 5px; text-align: left; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <h4 class="fw-bold mb-0"><i class="bi bi-key"></i> TẠO MẬT KHẨU MỚI</h4>
    </div>
    
    <div class="card-body p-4 text-center">
        <form method="post" class="django-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 mt-3 py-2 fw-bold shadow-sm">ĐỔI MẬT KHẨU</button>
        </form>
    </div>
</div>

</body>
</html>
