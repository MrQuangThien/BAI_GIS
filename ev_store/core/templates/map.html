<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ trạm sạc EV - TP.HCM | EV STORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f8f9fa; }
        #map { height: 70vh; min-height: 500px; width: 100%; }
        #sidebar {
            position: absolute;
            top: 76px; left: 12px; z-index: 1000;
            width: 340px; max-height: 82vh;
            background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            overflow-y: auto; padding: 18px;
        }
        #status { font-weight: 600; color: #198754; }
        .tram-item {
            cursor: pointer; padding: 12px; border-bottom: 1px solid #eee; transition: all 0.2s;
        }
        .tram-item:hover, .tram-item.active { background: #e9f7ef; border-left: 4px solid #198754; }
        .route-btn { background: #198754; border: none; }
        .route-btn:hover { background: #146c43; }
        .marker-tram {
            background: #198754; color: white; padding: 8px 12px;
            border-radius: 50%; font-size: 16px; text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }
        .loading-spinner { display: inline-block; width: 1rem; height: 1rem; border: 3px solid #198754; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-lightning-charge-fill me-1"></i> EV STORE
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Bản đồ trạm sạc</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Tin tức EV</a></li>
                </ul>
                <form class="d-flex me-3" role="search">
                    <input class="form-control me-2" type="search" placeholder="Tìm trạm..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar">
        <h5 class="mb-3"><i class="bi bi-ev-station-fill text-success me-2"></i>Trạm sạc gần bạn</h5>
        <p id="status"><span class="loading-spinner me-2"></span>Đang lấy vị trí...</p>

        <div class="mb-4">
            <strong>Trạm đang chọn:</strong>
            <div class="card mt-2 shadow-sm border-0">
                <div class="card-body">
                    <h6 id="tram-name" class="card-title mb-2">-</h6>
                    <p class="mb-1">Khoảng cách: <span id="distance">-</span></p>
                    <p class="mb-1">Địa chỉ: <span id="tram-address">-</span></p>
                    <p class="mb-2">Loại sạc: <span id="tram-type">-</span></p>
                    <button id="google-maps-btn" class="btn route-btn w-100 text-white fw-bold" disabled onclick="openGoogleMaps()">
                        <i class="bi bi-map me-2"></i>Mở Google Maps
                    </button>
                </div>
            </div>
        </div>

        <h6 class="mt-4 mb-2">Các trạm gần đây khác</h6>
        <div id="tram-list" class="list-group"></div>
    </div>

    <div id="map"></div>

    <script>
        let map, userMarker, radiusCircle, tramLayer = L.layerGroup(), routingControl = null;
        let userLat = null, userLon = null;
        let selectedTram = null;
        let allTrams = [];

        const DEFAULT_LAT = 10.7769;  // Quận 1
        const DEFAULT_LON = 106.7009;

        window.onload = () => {
            map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LON], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            tramLayer.addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        document.getElementById('status').innerHTML = '<i class="bi bi-check-circle-fill text-success me-2"></i>Vị trí đã xác định!';
                        showUserLocation();
                        fetchNearbyTrams();
                    },
                    err => {
                        document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Không lấy được vị trí → dùng mặc định TP.HCM trung tâm';
                        document.getElementById('status').classList.add('text-warning');
                        userLat = DEFAULT_LAT;
                        userLon = DEFAULT_LON;
                        showUserLocation();
                        fetchNearbyTrams();
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            } else {
                document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-circle-fill text-danger me-2"></i>Trình duyệt không hỗ trợ định vị';
                userLat = DEFAULT_LAT;
                userLon = DEFAULT_LON;
                showUserLocation();
                fetchNearbyTrams();
            }
        };

        function showUserLocation() {
            userMarker = L.marker([userLat, userLon]).addTo(map)
                .bindPopup('<b>Vị trí của bạn</b>')
                .openPopup();

            radiusCircle = L.circle([userLat, userLon], {
                radius: 15000,
                color: '#198754',
                fillColor: '#198754',
                fillOpacity: 0.12
            }).addTo(map);

            map.fitBounds(radiusCircle.getBounds().pad(0.2));
        }

        async function fetchNearbyTrams() {
            try {
                document.getElementById('status').innerHTML = '<span class="loading-spinner me-2"></span>Đang tải trạm sạc gần nhất...';
                const response = await fetch('/api/nearest-tram/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat: userLat, lon: userLon, radius: 20000 })
                });

                if (!response.ok) throw new Error('Lỗi server');

                const data = await response.json();
                allTrams = data.trams || [];

                if (allTrams.length === 0) {
                    document.getElementById('status').innerHTML = '<i class="bi bi-info-circle-fill text-info me-2"></i>Không tìm thấy trạm trong bán kính 20km';
                } else {
                    document.getElementById('status').innerHTML = `<i class="bi bi-check-circle-fill text-success me-2"></i>Tìm thấy ${allTrams.length} trạm`;
                }

                displayTrams(allTrams);
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>Lỗi tải dữ liệu trạm sạc';
            }
        }

        function displayTrams(trams) {
            const listEl = document.getElementById('tram-list');
            listEl.innerHTML = '';

            trams.forEach((tram, idx) => {
                // Sidebar item
                const item = document.createElement('div');
                item.className = 'tram-item list-group-item';
                item.innerHTML = `
                    <strong>${tram.ten_tram}</strong><br>
                    <small class="text-muted">${tram.dia_chi}</small><br>
                    <small class="text-success">${tram.distance ? '≈' + tram.distance + 'km • ' : ''}${tram.loai_sac} (${tram.cong_suat}kW)</small>
                `;
                item.onclick = () => selectTram(tram, idx);
                listEl.appendChild(item);

                // Map marker
                const marker = L.marker([tram.lat, tram.lon], {
                    icon: L.divIcon({
                        className: 'marker-tram',
                        html: '<i class="bi bi-ev-station"></i>',
                        iconSize: [38, 38],
                        iconAnchor: [19, 19]
                    })
                }).addTo(tramLayer);

                marker.bindPopup(`
                    <b>${tram.ten_tram}</b><br>
                    ${tram.dia_chi}<br>
                    ${tram.distance ? 'Khoảng cách: ≈' + tram.distance + 'km<br>' : ''}
                    Loại: ${tram.loai_sac} • ${tram.cong_suat}kW<br>
                    <button class="btn btn-sm btn-success mt-2" onclick="selectTram(allTrams[${idx}], ${idx})">Chọn & Đi</button>
                `);

                marker.on('click', () => selectTram(tram, idx));
            });

            if (trams.length > 0) selectTram(trams[0], 0);
        }

        function selectTram(tram, idx) {
            selectedTram = tram;

            document.getElementById('tram-name').textContent = tram.ten_tram;
            document.getElementById('distance').textContent = tram.distance ? `≈${tram.distance} km` : 'Chưa tính';
            document.getElementById('tram-address').textContent = tram.dia_chi;
            document.getElementById('tram-type').textContent = `${tram.loai_sac} (${tram.cong_suat}kW)`;

            document.getElementById('google-maps-btn').disabled = false;

            document.querySelectorAll('.tram-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tram-item')[idx]?.classList.add('active');

            map.setView([tram.lat, tram.lon], 15);
            drawRoute(tram.lat, tram.lon, tram.ten_tram);
        }

        function drawRoute(destLat, destLon, name) {
            if (routingControl) routingControl.remove();

            routingControl = L.Routing.control({
                waypoints: [L.latLng(userLat, userLon), L.latLng(destLat, destLon)],
                routeWhileDragging: true,
                show: false,
                addWaypoints: false,
                fitSelectedRoutes: true,
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                createMarker: (i, wp) => {
                    if (i === 1) {
                        return L.marker(wp.latLng, {
                            icon: L.divIcon({ className: 'marker-tram', html: name })
                        });
                    }
                    return null;
                }
            }).addTo(map);
        }

        function openGoogleMaps() {
            if (!selectedTram) return;
            const url = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${selectedTram.lat},${selectedTram.lon}&travelmode=driving`;
            window.open(url, '_blank');
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
