<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | EV Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #198754 0%, #212529 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .auth-card { background: white; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; max-width: 400px; overflow: hidden; }
        .auth-header { background: #198754; color: white; padding: 30px 20px; text-align: center; }
        .btn-success { background-color: #198754; border: none; }
        .btn-success:hover { background-color: #157347; }
        .form-control:focus { border-color: #198754; box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <h3 class="fw-bold mb-0"><i class="bi bi-shield-lock-fill"></i> QUÊN MẬT KHẨU</h3>
    </div>
    
    <div class="card-body p-4 text-center">
        <p class="text-muted small mb-4">Vui lòng nhập Email liên kết với tài khoản. Chúng tôi sẽ gửi một liên kết để bạn đặt lại mật khẩu an toàn.</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold text-muted">EMAIL CỦA BẠN</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
                    <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="name@example.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">
                GỬI LIÊN KẾT RESET
            </button>
        </form>
    </div>
    <div class="bg-light text-center py-3 border-top">
        <a href="{% url 'login' %}" class="small text-success text-decoration-none fw-bold"><i class="bi bi-arrow-left me-1"></i> Quay lại Đăng nhập</a>
    </div>
</div>

</body>
</html>
