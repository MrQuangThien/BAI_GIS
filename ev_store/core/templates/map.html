<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ trạm sạc EV - TP.HCM | EV STORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8f9fa;
        }

        #map {
            height: 70vh;
            min-height: 500px;
            width: 100%;
        }

        #sidebar {
            position: absolute;
            top: 76px;
            left: 12px;
            z-index: 1000;
            width: 340px;
            max-height: 82vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            overflow-y: auto;
            padding: 18px;
        }

        #status {
            font-weight: 600;
            color: #198754;
        }

        .tram-item {
            cursor: pointer;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: all 0.2s;
        }

        .tram-item:hover,
        .tram-item.active {
            background: #e9f7ef;
            border-left: 4px solid #198754;
        }

        .route-btn {
            background: #198754;
            border: none;
        }

        .route-btn:hover {
            background: #146c43;
        }

        .marker-tram {
            background: #198754;
            color: white;
            padding: 8px 12px;
            border-radius: 50%;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 3px solid #198754;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-lightning-charge-fill me-1"></i> EV STORE
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="/core/map">Bản đồ trạm sạc</a></li>
                     <li class="nav-item"><a class="nav-link" href="/">Trang Chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="/core/dashboard/">Trang Quản Trị</a></li>
                </ul>
                <form class="d-flex me-3" role="search"
                    onsubmit="event.preventDefault(); timKiemDiaChi(document.getElementById('searchInput').value);">
                    <input id="searchInput" class="form-control me-2" type="search" placeholder="Nhập địa chỉ"
                        aria-label="Search" style="width: 300px;">
                    <button class="btn btn-light" type="submit"><i
                            class="bi bi-search text-success fw-bold"></i></button>
                </form>
            </div>
        </div>
    </nav>

    <div id="sidebar">
        <h5 class="mb-3"><i class="bi bi-ev-station-fill text-success me-2"></i>Trạm sạc quanh bạn</h5>
        <p id="status"><span class="loading-spinner me-2"></span>Đang lấy vị trí...</p>

        <div class="mb-3">
            <label for="radius-slider" class="form-label fw-bold text-success" style="font-size: 0.9rem;">
                <i class="bi bi-bullseye me-1"></i>Bán kính tìm kiếm: <span id="radius-val">20</span> km
            </label>
            <input type="range" class="form-range" id="radius-slider" min="1" max="50" step="1" value="20"
                oninput="document.getElementById('radius-val').textContent = this.value" onchange="thayDoiBanKinh()">
        </div>

        <div class="card border-success border-opacity-25 mb-3 shadow-sm">
            <div class="card-body p-2 bg-success bg-opacity-10 rounded">
                <select id="filter-type" class="form-select form-select-sm mb-2" onchange="apDungBoLoc()">
                    <option value="all">⚡ Hiển thị tất cả loại sạc</option>
                    <option value="DC">🚀 Chỉ hiện sạc nhanh (DC)</option>
                    <option value="AC">🔋 Chỉ hiện sạc thường (AC)</option>
                </select>
                <div class="form-check form-switch ms-1">
                    <input class="form-check-input" type="checkbox" id="filter-power" onchange="apDungBoLoc()">
                    <label class="form-check-label text-success fw-bold" style="font-size: 0.85rem;">Công suất lớn (≥
                        50kW)</label>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <strong>Trạm đang chọn:</strong>
            <div class="card mt-2 shadow-sm border-0">
                <div class="card-body">
                    <h6 id="tram-name" class="card-title mb-2">-</h6>
                    <p class="mb-1">Khoảng cách: <span id="distance">-</span></p>
                    <p class="mb-1">Địa chỉ: <span id="tram-address">-</span></p>
                    <p class="mb-2">Loại sạc: <span id="tram-type">-</span></p>
                    <button id="google-maps-btn" class="btn route-btn w-100 text-white fw-bold" disabled
                        onclick="openGoogleMaps()">
                        <i class="bi bi-map me-2"></i>Mở Google Maps
                    </button>
                </div>
            </div>
        </div>

        <h6 class="mt-4 mb-2">Danh sách trạm lân cận (20km)</h6>
        <div id="tram-list" class="list-group"></div>
    </div>

    <div id="map"></div>

    <script>
        let map, userMarker, radiusCircle, tramLayer = L.layerGroup(), routingControl = null;
        let userLat = null, userLon = null;
        let selectedTram = null;
        let currentRadius = 20000; // Biến lưu bán kính hiện tại (mặc định 20km = 20000m)
        let allTrams = [];

        const DEFAULT_LAT = 10.7769;  // Quận 1, TP.HCM
        const DEFAULT_LON = 106.7009;

        window.onload = () => {
            map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LON], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            tramLayer.addTo(map);

            // BẤM ĐỂ CHỌN VỊ TRÍ MỚI
            map.on('click', function (e) {
                userLat = e.latlng.lat;
                userLon = e.latlng.lng;


                if (userMarker) {
                    userMarker.setLatLng([userLat, userLon]);
                    userMarker.getPopup().setContent("<b>Vị trí bạn chọn</b>").update();
                } else {
                    userMarker = L.marker([userLat, userLon]).addTo(map).bindPopup('<b>Vị trí bạn chọn</b>').openPopup();
                }
                if (radiusCircle) {
                    radiusCircle.setLatLng([userLat, userLon]);
                }
                if (routingControl) {
                    routingControl.remove();
                    routingControl = null;
                }


                document.getElementById('status').innerHTML = '<span class="loading-spinner me-2"></span>Đang quét trạm quanh vị trí mới...';
                document.getElementById('tram-name').textContent = "-";
                document.getElementById('distance').textContent = "-";
                document.getElementById('tram-address').textContent = "-";
                document.getElementById('tram-type').textContent = "-";
                document.getElementById('google-maps-btn').disabled = true;

                fetchNearbyTrams();
            });


            // Lấy vị trí GPS người dùng
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        document.getElementById('status').innerHTML = '<i class="bi bi-check-circle-fill text-success me-2"></i>Vị trí đã xác định!';
                        showUserLocation();
                        fetchNearbyTrams();
                    },
                    err => {
                        document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Không lấy được GPS → Dùng mặc định TP.HCM';
                        document.getElementById('status').classList.add('text-warning');
                        userLat = DEFAULT_LAT;
                        userLon = DEFAULT_LON;
                        showUserLocation();
                        fetchNearbyTrams();
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            } else {
                document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-circle-fill text-danger me-2"></i>Trình duyệt không hỗ trợ định vị';
                userLat = DEFAULT_LAT;
                userLon = DEFAULT_LON;
                showUserLocation();
                fetchNearbyTrams();
            }
        };

        function showUserLocation() {
            userMarker = L.marker([userLat, userLon]).addTo(map)
                .bindPopup('<b>Vị trí của bạn</b>')
                .openPopup();

            radiusCircle = L.circle([userLat, userLon], {
                radius: currentRadius,
                color: '#198754',
                fillColor: '#198754',
                fillOpacity: 0.12
            }).addTo(map);

            map.fitBounds(radiusCircle.getBounds().pad(0.2));
        }

        async function fetchNearbyTrams() {
            try {
                const response = await fetch('/core/api/nearest-tram/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat: userLat, lon: userLon, radius: currentRadius })
                });

                if (!response.ok) throw new Error('Lỗi server');

                const data = await response.json();

                allTrams = data.trams || [];

                if (allTrams.length === 0) {
                    document.getElementById('status').innerHTML = '<i class="bi bi-info-circle-fill text-info me-2"></i>Không tìm thấy trạm trong bán kính 20km';
                } else {
                    document.getElementById('status').innerHTML = `<i class="bi bi-check-circle-fill text-success me-2"></i>Tìm thấy ${allTrams.length} trạm`;
                }

                displayTrams(allTrams);
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>Lỗi tải dữ liệu trạm sạc';

                allTrams = [];
                displayTrams(allTrams);
            }
        }

        function displayTrams(trams) {
            const listEl = document.getElementById('tram-list');
            listEl.innerHTML = '';

            tramLayer.clearLayers();

            trams.forEach((tram, idx) => {

                const item = document.createElement('div');
                item.className = 'tram-item list-group-item';
                item.innerHTML = `
                    <strong>${tram.ten_tram}</strong><br>
                    <small class="text-muted">${tram.dia_chi}</small><br>
                    <small class="text-success">${tram.distance ? 'Cách ≈ ' + tram.distance + ' km • ' : ''}${tram.loai_sac} (${tram.cong_suat}kW)</small>
                `;
                item.onclick = () => selectTram(tram, idx);
                listEl.appendChild(item);


                const marker = L.marker([tram.lat, tram.lon], {
                    icon: L.divIcon({
                        className: 'marker-tram',
                        html: '<i class="bi bi-ev-station"></i>',
                        iconSize: [38, 38],
                        iconAnchor: [19, 19]
                    })
                }).addTo(tramLayer);

                // FIX LỖI OBJECT OBJECT Ở NÚT BẤM (Dùng hàm trung gian triggerSelectTram)
                marker.bindPopup(`
                    <div style="text-align: center;">
                        <b class="text-success">${tram.ten_tram}</b><br>
                        ${tram.distance ? 'Cách bạn: <b>≈ ' + tram.distance + ' km</b><br>' : ''}
                        Loại: ${tram.loai_sac} • ${tram.cong_suat}kW<br>
                        <button class="btn btn-sm btn-success mt-2" onclick="triggerSelectTram(${idx})">
                            <i class="bi bi-geo-alt-fill"></i> Chỉ đường tới đây
                        </button>
                    </div>
                `);

                marker.on('click', () => selectTram(tram, idx));
            });


            if (trams.length > 0) selectTram(trams[0], 0);
        }

        // Hàm mồi để fix lỗi truyền tham số Object trong chuỗi HTML
        function triggerSelectTram(idx) {
            selectTram(allTrams[idx], idx);
            map.closePopup(); // Đóng popup sau khi bấm chỉ đường
        }

        function selectTram(tram, idx) {
            selectedTram = tram;

            document.getElementById('tram-name').textContent = tram.ten_tram;
            document.getElementById('distance').textContent = tram.distance ? `≈ ${tram.distance} km` : 'Chưa tính';
            document.getElementById('tram-address').textContent = tram.dia_chi;
            document.getElementById('tram-type').textContent = `${tram.loai_sac} (${tram.cong_suat}kW)`;

            document.getElementById('google-maps-btn').disabled = false;

            document.querySelectorAll('.tram-item').forEach(el => el.classList.remove('active'));
            const listItems = document.querySelectorAll('.tram-item');
            if (listItems[idx]) listItems[idx].classList.add('active');

            map.setView([tram.lat, tram.lon], 14);
            drawRoute(tram.lat, tram.lon, tram.ten_tram);
        }

        function drawRoute(destLat, destLon, name) {
            if (routingControl) routingControl.remove();

            routingControl = L.Routing.control({
                waypoints: [L.latLng(userLat, userLon), L.latLng(destLat, destLon)],
                routeWhileDragging: false,
                show: false,
                addWaypoints: false,
                fitSelectedRoutes: true,
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                lineOptions: {
                    styles: [{ color: '#198754', opacity: 0.8, weight: 6 }] // Đường màu xanh lá EV
                },
                createMarker: (i, wp) => {
                    if (i === 1) { // 1 là điểm đích
                        return L.marker(wp.latLng, {
                            icon: L.divIcon({
                                className: 'marker-tram',
                                html: '<i class="bi bi-geo-alt-fill"></i>', // Sửa lỗi vỡ icon
                                iconSize: [38, 38],
                                iconAnchor: [19, 19]
                            })
                        }).bindTooltip("Đích đến: " + name, { permanent: true, direction: 'top' });
                    }
                    return null; // Không vẽ đè lên điểm xuất phát
                }
            }).addTo(map);
        }

        // FIX LỖI LINK GOOGLE MAPS
        function openGoogleMaps() {
            if (!selectedTram) return;
            // Link chuẩn của Google Maps API
            const url = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${selectedTram.lat},${selectedTram.lon}&travelmode=driving`;
            window.open(url, '_blank');
        }


        // ---------------------------------------------------------
        // CHỨC NĂNG 2: BỘ LỌC THUỘC TÍNH (Lọc mảng allTrams)
        // ---------------------------------------------------------
        function apDungBoLoc() {
            if (!allTrams || allTrams.length === 0) return;

            const filterType = document.getElementById('filter-type').value; // 'all', 'DC', 'AC'
            const filterPower = document.getElementById('filter-power').checked; // true/false

            // Lọc dữ liệu từ giỏ allTrams
            const filteredTrams = allTrams.filter(tram => {
                // Kiểm tra loại sạc
                let matchType = true;
                if (filterType !== 'all') {
                    matchType = tram.loai_sac.toUpperCase().includes(filterType);
                }

                // Kiểm tra công suất
                let matchPower = true;
                if (filterPower) {
                    matchPower = parseFloat(tram.cong_suat) >= 50.0;
                }

                return matchType && matchPower;
            });

            // Vẽ lại bản đồ với danh sách đã lọc
            displayTrams(filteredTrams);
            document.getElementById('status').innerHTML = `<i class="bi bi-funnel-fill text-success me-2"></i>Đã lọc ra ${filteredTrams.length} trạm phù hợp`;
        }

        // ---------------------------------------------------------
        // CHỨC NĂNG 3: TÌM KIẾM ĐỊA CHỈ (Geocoding API Nominatim)
        // ---------------------------------------------------------
        async function timKiemDiaChi(query) {
            if (!query) return;
            document.getElementById('status').innerHTML = '<span class="loading-spinner me-2"></span>Đang bay đến địa chỉ...';

            try {
                // Gọi API miễn phí của OpenStreetMap để dịch chữ thành Tọa độ
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=vn`);
                const data = await res.json();

                if (data.length > 0) {
                    // Lấy tọa độ điểm đầu tiên tìm được
                    userLat = parseFloat(data[0].lat);
                    userLon = parseFloat(data[0].lon);

                    // Bay bản đồ tới đó
                    map.setView([userLat, userLon], 14);

                    // Cập nhật ghim và vòng tròn
                    if (userMarker) {
                        userMarker.setLatLng([userLat, userLon]).getPopup().setContent(`<b>${data[0].display_name}</b>`).update();
                    } else {
                        userMarker = L.marker([userLat, userLon]).addTo(map).bindPopup(`<b>${data[0].display_name}</b>`).openPopup();
                    }
                    if (radiusCircle) radiusCircle.setLatLng([userLat, userLon]);
                    if (routingControl) { routingControl.remove(); routingControl = null; }

                    document.getElementById('status').innerHTML = '<span class="loading-spinner me-2"></span>Đang quét trạm khu vực này...';

                    // Gửi tọa độ mới về Backend để quét trạm xung quanh
                    fetchNearbyTrams();
                } else {
                    alert("Không tìm thấy địa chỉ này! Thử gõ thêm tên Tỉnh/Thành phố nhé.");
                    document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Không tìm thấy địa chỉ';
                }
            } catch (error) {
                console.error(error);
            }
        }

        // ---------------------------------------------------------
        // CHỨC NĂNG 1: THAY ĐỔI BÁN KÍNH VÙNG ĐỆM ĐỘNG
        // ---------------------------------------------------------
        function thayDoiBanKinh() {
            // Lấy số km trên thanh trượt và nhân 1000 để ra mét
            let km = document.getElementById('radius-slider').value;
            currentRadius = km * 1000;

            // 1. Phình to hoặc thu nhỏ vòng tròn màu xanh lá trên bản đồ
            if (radiusCircle && userLat && userLon) {
                radiusCircle.setRadius(currentRadius);
                map.fitBounds(radiusCircle.getBounds().pad(0.2));
            }

            // 2. Gửi lệnh cho Backend quét lại các trạm lọt vào vòng tròn mới này
            if (userLat && userLon) {
                document.getElementById('status').innerHTML = '<span class="loading-spinner me-2"></span>Đang quét lại bán kính mới...';
                fetchNearbyTrams();
            }
        }


    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
