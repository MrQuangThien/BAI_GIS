{% extends 'base_admin.html' %}

{% block title %}{{ title }} | EV STORE{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-dark"><i class="bi bi-pencil-square me-2 text-success"></i>{{ title }}</h3>
    <a href="{% url 'danh_sach_xe' %}" class="btn btn-outline-secondary fw-bold"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
</div>

<div class="card shadow-sm border-0 rounded-3 p-4">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            {% for field in form %}
                <div class="{% if field.name == 'mo_ta' %}col-12{% else %}col-md-6{% endif %} mb-2">
                    <label class="form-label fw-bold text-muted">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
                </div>
            {% endfor %}
        </div>
        <div class="text-end mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-success px-5 fw-bold"><i class="bi bi-save me-1"></i> Lưu thông tin</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Tìm ô nhập liệu có ID là id_mo_ta (do Django tự sinh ra)
        const moTaTextarea = document.querySelector('#id_mo_ta');
        if (moTaTextarea) {
            ClassicEditor
                .create(moTaTextarea)
                .then(editor => {
                    // Chỉnh chiều cao cho khung soạn thảo
                    editor.ui.view.editable.element.style.minHeight = '250px';
                })
                .catch(error => {
                    console.error(error);
                });
        }
    });
</script>
{% endblock %}
