<!DOCTYPE html>
<html>
<head>
    <title>Sửa User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Sửa người dùng</h2>

<form method="post">
    {% csrf_token %}
    
    <div class="mb-3">
        <label>Username</label>
        {{ form.username }}
    </div>

    <div class="mb-3">
        <label>Email</label>
        {{ form.email }}
    </div>

    <div class="mb-3">
        <label>Password (để trống nếu không đổi)</label>
        {{ form.password }}
    </div>

    <div class="form-check">
        {{ form.is_staff }} <label class="form-check-label">Nhân viên</label>
    </div>

    <div class="form-check">
        {{ form.is_superuser }} <label class="form-check-label">Admin</label>
    </div>

    <br>

    <button class="btn btn-warning">Cập nhật</button>
    <a href="{% url 'list_user' %}" class="btn btn-secondary">Quay lại</a>
</form>

</body>
</html>
