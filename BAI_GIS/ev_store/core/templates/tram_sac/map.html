<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Hệ sinh thái EV STORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f8f9fa; overflow: hidden; }
        #map { height: calc(100vh - 56px); width: 100%; }
        
        #sidebar {
            position: absolute; top: 70px; left: 15px; z-index: 1000; width: 380px;
            max-height: calc(100vh - 90px); background: white; border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); overflow-y: auto; padding: 15px;
            scroll-behavior: smooth;
        }
        
        .search-wrapper { transition: all 0.3s ease; }
        .search-wrapper:focus-within { box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25) !important; border-color: #198754 !important; }
        .search-wrapper input:focus { box-shadow: none; outline: none; }

        .list-item { cursor: pointer; padding: 12px; border-bottom: 1px solid #eee; transition: all 0.2s; }
        .list-item:hover, .list-item.active { background: #e9f7ef; border-left: 4px solid #198754; }
        .list-item.active-store { background: #e0f7fa; border-left: 4px solid #0dcaf0; }
        
        .marker-tram { background: #198754; color: white; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.3); border: 2px solid white;}
        .marker-store { background: #0dcaf0; color: white; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.3); border: 2px solid white;}
        
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
        .leaflet-popup-content { margin: 12px; line-height: 1.4; width: 240px !important;}
        
        #charging-panel { display: none; background: #212529; color: white; border-radius: 10px; padding: 15px; margin-top: 15px; text-align: center; }
        .timer-text { font-size: 2.2rem; font-weight: bold; color: #20c997; font-family: monospace; text-shadow: 0 0 10px rgba(32,201,151,0.4); }
        .loading-spinner { display: inline-block; width: 1rem; height: 1rem; border: 3px solid #198754; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-lightning-charge-fill me-1 text-warning"></i> EV STORE MAPS
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="/">Về Trang Chủ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="sidebar">
        <form class="search-wrapper d-flex mb-3 shadow-sm rounded-pill border bg-white" onsubmit="event.preventDefault(); timKiemDiaChi(document.getElementById('sideSearchInput').value);">
            <input id="sideSearchInput" class="form-control border-0 rounded-start-pill ps-3 bg-transparent" type="search" placeholder="📍 Nhập khu vực, tên đường..." aria-label="Search">
            <button class="btn text-success border-0 rounded-end-pill pe-3 bg-transparent" type="submit">
                <i class="bi bi-search fw-bold"></i>
            </button>
        </form>

        <ul class="nav nav-pills nav-fill mb-3 bg-light rounded p-1 shadow-sm" id="mapTabs">
            <li class="nav-item">
                <button class="nav-link active fw-bold" id="tab-tram" onclick="switchTab('tram')"><i class="bi bi-ev-station-fill me-1"></i> Trạm Sạc</button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold text-dark" id="tab-store" onclick="switchTab('store')"><i class="bi bi-shop me-1"></i> Chi Nhánh</button>
            </li>
        </ul>

        <p id="status" class="text-secondary fw-semibold small mb-2"><span class="loading-spinner me-2"></span>Đang tải dữ liệu...</p>

        <div class="card bg-light border-0 mb-3 shadow-sm">
            <div class="card-body p-3 rounded">
                <label class="form-label fw-bold text-dark small mb-1">
                    <i class="bi bi-bullseye me-1 text-success"></i>Bán kính tìm kiếm: <span id="radius-val" class="text-danger fs-6">5</span> km
                </label>
                <input type="range" class="form-range" id="radius-slider" min="1" max="50" step="1" value="5" 
                       oninput="document.getElementById('radius-val').textContent = this.value" 
                       onchange="thayDoiBanKinh()">
            </div>
        </div>

        <div id="info-panel" style="display: none;">
            <div class="card shadow-sm border-success border-opacity-50 overflow-hidden">
                <img id="item-image" src="" class="card-img-top" style="height: 160px; object-fit: cover; display: none;" alt="Ảnh minh họa">
                <div class="card-body">
                    <span class="badge bg-success mb-2" id="item-type">-</span>
                    <h6 id="item-name" class="card-title mb-2 fw-bold text-dark">-</h6>
                    <p class="mb-1 small text-muted"><i class="bi bi-geo-alt me-1"></i> <span id="item-address">-</span></p>
                    <p class="mb-2 small fw-bold text-primary"><i class="bi bi-cursor me-1"></i> Cách bạn: <span id="item-distance">-</span></p>
                    <p class="mb-2 small" id="charge-speed" style="display: none;"></p>
                    
                    <div class="d-grid gap-2 mt-3">
                        <button id="btn-draw-route" class="btn btn-primary fw-bold shadow-sm" onclick="veDuongDi()">
                            <i class="bi bi-sign-turn-right-fill me-1"></i> Vẽ đường đi
                        </button>
                        <div class="d-flex gap-2">
                            <button id="google-maps-btn" class="btn btn-outline-dark btn-sm fw-bold w-100" onclick="openGoogleMaps()">
                                <i class="bi bi-map me-1 text-success"></i> App Google Maps
                            </button>
                            <button id="btn-start-charge" class="btn btn-success btn-sm fw-bold w-100 shadow-sm" onclick="batDauSac()">
                                <i class="bi bi-plug-fill me-1"></i> Sạc pin
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="charging-panel" class="shadow-lg border border-success">
            <h6 class="text-success text-uppercase fw-bold mb-1"><i class="bi bi-lightning-charge-fill animate-pulse"></i> Đang sạc pin...</h6>
            <div id="charge-timer" class="timer-text">00:00:00</div>
            <button class="btn btn-danger w-100 fw-bold mt-3" onclick="ketThucSac()">
                <i class="bi bi-stop-circle me-1"></i> Kết thúc Phiên sạc
            </button>
        </div>

        <h6 class="mt-4 mb-2 fw-bold text-secondary border-bottom pb-2">Danh sách trong bán kính</h6>
        <div id="item-list" class="list-group shadow-sm mb-4"></div>
    </div>

    <div id="map"></div>

    <div class="modal fade" id="ratingModal" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-success text-white border-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-receipt-cutoff me-2"></i>Biên lai Phiên sạc</h5>
                </div>
                <div class="modal-body text-center p-4">
                    <p class="text-muted mb-1">Tổng chi phí thanh toán</p>
                    <h2 id="bill-total" class="text-success fw-bold mb-3">0 VNĐ</h2>
                    <div class="bg-light rounded p-3 text-start mb-4">
                        <p class="mb-1">Thời gian sạc: <strong id="bill-time" class="float-end">0 phút</strong></p>
                        <p class="mb-0">Đơn giá: <span class="float-end">3,500đ / phút</span></p>
                    </div>
                    <hr>
                    <p class="fw-bold mb-2">Đánh giá chất lượng trạm sạc này:</p>
                    <select id="station-rating" class="form-select form-select-lg w-75 mx-auto text-center font-monospace">
                        <option value="5">⭐⭐⭐⭐⭐ (Rất tốt)</option>
                        <option value="4">⭐⭐⭐⭐ (Tốt)</option>
                        <option value="3">⭐⭐⭐ (Bình thường)</option>
                        <option value="2">⭐⭐ (Kém)</option>
                        <option value="1">⭐ (Rất tệ)</option>
                    </select>
                </div>
                <div class="modal-footer border-0 justify-content-center pb-4">
                    <button type="button" class="btn btn-success btn-lg px-5 fw-bold rounded-pill" data-bs-dismiss="modal" onclick="guiDanhGia()">Hoàn tất</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map, userMarker, radiusCircle, markersLayer = L.layerGroup(), routingControl = null;
        let userLat = 10.7769, userLon = 106.7009; 
        let selectedItem = null;
        let allTrams = []; 
        let allStores = [];
        let currentTab = 'tram'; 
        let currentRadius = 5000; 
        
        let isCharging = false;
        let startTime, timerInterval, elapsedSeconds = 0;

        window.onload = async () => {
            map = L.map('map').setView([userLat, userLon], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '© CartoDB'
            }).addTo(map);

            markersLayer.addTo(map);
            document.getElementById('status').innerHTML = '<span class="loading-spinner me-2"></span> Đang kết nối cơ sở dữ liệu...';

            try {
                const [resTram, resStore] = await Promise.all([
                    fetch("{% url 'tram_api' %}").catch(() => null),
                    fetch("{% url 'cua_hang_api' %}").catch(() => null)
                ]);

                if (resTram && resTram.ok) allTrams = await resTram.json();
                if (resStore && resStore.ok) allStores = await resStore.json();
                
                document.getElementById('status').innerHTML = '<span class="loading-spinner me-2"></span> Đang định vị trí của bạn...';
                
            } catch (error) {
                console.log("Lỗi fetch API", error);
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        updateUserLocation();
                    },
                    err => {
                        document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning me-1"></i> Dùng vị trí mặc định (TP.HCM)';
                        updateUserLocation();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                updateUserLocation();
            }

            map.on('click', function (e) {
                if (e.originalEvent.target.tagName.toLowerCase() === 'path' && !e.originalEvent.target.classList.contains('vung-dem-circle')) return; 
                userLat = e.latlng.lat;
                userLon = e.latlng.lng;
                updateUserLocation();
            });
        };

        async function timKiemDiaChi(query) {
            if (!query) return;
            document.getElementById('status').innerHTML = '<span class="loading-spinner me-2"></span> Đang dò tìm địa chỉ...';

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=vn`);
                const data = await res.json();

                if (data.length > 0) {
                    userLat = parseFloat(data[0].lat);
                    userLon = parseFloat(data[0].lon);
                    updateUserLocation();
                    document.getElementById('status').innerHTML = '<i class="bi bi-check-circle-fill text-success me-1"></i> Đã đến địa chỉ vừa tìm!';
                } else {
                    alert("Không tìm thấy địa chỉ này! Thử gõ thêm tên Tỉnh/Thành phố nhé.");
                    document.getElementById('status').innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning me-1"></i> Không tìm thấy địa chỉ';
                }
            } catch (error) {
                console.error(error);
            }
        }

        function thayDoiBanKinh() {
            currentRadius = parseInt(document.getElementById('radius-slider').value) * 1000;
            if (radiusCircle) {
                radiusCircle.setRadius(currentRadius);
                map.fitBounds(radiusCircle.getBounds().pad(0.1));
            }
            renderItems(); 
        }

        function updateUserLocation() {
            if (userMarker) {
                userMarker.setLatLng([userLat, userLon]);
            } else {
                userMarker = L.marker([userLat, userLon]).addTo(map).bindPopup('<b>Vị trí của bạn</b>').openPopup();
            }
            
            if (radiusCircle) {
                radiusCircle.setLatLng([userLat, userLon]).setRadius(currentRadius);
            } else {
                radiusCircle = L.circle([userLat, userLon], { radius: currentRadius, color: '#0d6efd', fillColor: '#0d6efd', fillOpacity: 0.1, className: 'vung-dem-circle' }).addTo(map);
            }
            
            if(routingControl) { routingControl.remove(); routingControl = null; }
            map.fitBounds(radiusCircle.getBounds().pad(0.1));
            
            renderItems();
        }

        function switchTab(tabName) {
            if(isCharging) { alert("Vui lòng kết thúc phiên sạc hiện tại trước khi chuyển tab!"); return; }
            
            currentTab = tabName;
            document.getElementById('tab-tram').className = "nav-link fw-bold text-dark";
            document.getElementById('tab-store').className = "nav-link fw-bold text-dark";

            if(tabName === 'tram') {
                document.getElementById('tab-tram').classList.add('active', 'bg-success', 'text-white');
            } else {
                document.getElementById('tab-store').classList.add('active', 'bg-info');
            }

            document.getElementById('info-panel').style.display = 'none';
            if(routingControl) { routingControl.remove(); routingControl = null; }
            
            renderItems();
        }

        function renderItems() {
            const listEl = document.getElementById('item-list');
            listEl.innerHTML = '';
            markersLayer.clearLayers();

            let dataSource = currentTab === 'tram' ? allTrams : allStores;
            let count = 0;

            dataSource.forEach((item, idx) => {
                let lat = parseFloat(item.lat);
                let lon = parseFloat(item.lon);
                if (isNaN(lat) || isNaN(lon)) return;

                const dist = map.distance([userLat, userLon], [lat, lon]);

                if (dist <= currentRadius) {
                    count++;
                    const distKm = (dist / 1000).toFixed(2);
                    const isTram = currentTab === 'tram';
                    
                    const name = isTram ? item.ten_tram : item.ten_cua_hang;
                    const address = item.dia_chi || 'Chưa cập nhật địa chỉ';
                    const subInfo = isTram ? `${item.loai_sac} • ${item.cong_suat}kW` : `<i class="bi bi-telephone"></i> ${item.sdt || 'Đang cập nhật'}`;
                    const iconClass = isTram ? 'marker-tram' : 'marker-store';
                    const iconHtml = isTram ? '<i class="bi bi-ev-station"></i>' : '<i class="bi bi-shop"></i>';

                    const imgUrl = item.hinh_anh ? item.hinh_anh : (isTram ? 'https://images.unsplash.com/photo-1593941707882-a5bba14938cb?auto=format&fit=crop&q=80&w=400&h=200' : 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&q=80&w=400&h=200');

                    // 1. Dựng danh sách Menu Trái
                    const div = document.createElement('div');
                    div.className = `list-item list-group-item border-0 rounded mb-2 shadow-sm`;
                    div.innerHTML = `
                        <div class="fw-bold text-dark">${name}</div>
                        <div class="small text-muted text-truncate">${address}</div>
                        <div class="small mt-1 ${isTram ? 'text-success' : 'text-info text-dark'} fw-semibold">
                            <i class="bi bi-cursor-fill"></i> ${distKm} km | ${subInfo}
                        </div>
                    `;
                    div.onclick = () => {
                        document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active', 'active-store'));
                        div.classList.add(isTram ? 'active' : 'active-store');
                        chonItem(item, distKm, name, address, isTram, imgUrl, subInfo);
                        
                        document.getElementById('sidebar').scrollTop = 0;
                    };
                    listEl.appendChild(div);

                    // 2. Dựng Popup cực đẹp trên Bản Đồ
                    const marker = L.marker([lat, lon], {
                        icon: L.divIcon({ className: iconClass, html: iconHtml, iconSize: [35, 35] })
                    }).addTo(markersLayer);

                    const popupHtml = `
                        <div style="text-align: center; font-family: system-ui, sans-serif;">
                            <img src="${imgUrl}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee;">
                            <h6 style="margin: 0 0 5px 0; color: ${isTram ? '#198754' : '#0dcaf0'}; font-weight: bold; font-size: 15px;">${name}</h6>
                            <p style="margin: 0 0 8px 0; font-size: 12px; color: #6c757d; line-height: 1.4;">${address}</p>
                            
                            <div style="margin-bottom: 10px; font-size: 13px; font-weight: bold; color: #333;">
                                ${subInfo}
                            </div>
                            
                            <div style="background: ${isTram ? '#e9f7ef' : '#e0f7fa'}; color: ${isTram ? '#198754' : '#087990'}; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 15px;">
                                <i class="bi bi-cursor-fill"></i> Cách bạn: ${distKm} km
                            </div>

                            <div class="d-flex gap-2 justify-content-center">
                                <button class="btn btn-sm btn-primary w-100 shadow-sm fw-bold" onclick="veDuongDi()">
                                    <i class="bi bi-sign-turn-right-fill"></i> Chỉ đường
                                </button>
                                ${isTram ? `
                                <button class="btn btn-sm btn-success w-100 shadow-sm fw-bold" onclick="batDauSac()">
                                    <i class="bi bi-plug-fill"></i> Sạc pin
                                </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupHtml);
                    
                    marker.on('click', () => {
                        div.click();
                    });
                }
            });

            document.getElementById('status').innerHTML = `<i class="bi bi-check-circle-fill text-success me-1"></i> Tìm thấy ${count} ${currentTab === 'tram' ? 'trạm sạc' : 'chi nhánh'}`;
        }

        function chonItem(item, distance, name, address, isTram, imgUrl, subInfo) {
            if(isCharging) { alert("Vui lòng kết thúc phiên sạc hiện tại!"); return; }
            selectedItem = item;
            
            document.getElementById('info-panel').style.display = 'block';
            document.getElementById('item-name').textContent = name;
            document.getElementById('item-address').textContent = address;
            document.getElementById('item-distance').textContent = distance + " km";
            
            const imgEl = document.getElementById('item-image');
            imgEl.src = imgUrl;
            imgEl.style.display = 'block';

            let typeBadge = document.getElementById('item-type');
            let btnCharge = document.getElementById('btn-start-charge');
            let txtSpeed = document.getElementById('charge-speed');

            if(isTram) {
                typeBadge.textContent = "TRẠM SẠC ĐIỆN";
                typeBadge.className = "badge bg-success mb-2";
                btnCharge.style.display = "block"; 
                txtSpeed.style.display = "block";
                txtSpeed.innerHTML = `<i class="bi bi-lightning-charge me-1"></i>Thông số: <span class="text-warning fw-bold">${subInfo}</span>`;
            } else {
                typeBadge.textContent = "CHI NHÁNH CỬA HÀNG";
                typeBadge.className = "badge bg-info text-dark mb-2";
                btnCharge.style.display = "none"; 
                txtSpeed.style.display = "block";
                txtSpeed.innerHTML = `<i class="bi bi-telephone-fill me-1"></i>Hotline: <span class="text-primary fw-bold">${item.sdt || 'Đang cập nhật'}</span>`;
            }
            
            if (routingControl) {
                routingControl.remove();
                routingControl = null;
            }
            map.setView([item.lat, item.lon], 15);
        }

        function veDuongDi() {
            if (!selectedItem) return;
            if (routingControl) routingControl.remove();

            routingControl = L.Routing.control({
                waypoints: [L.latLng(userLat, userLon), L.latLng(selectedItem.lat, selectedItem.lon)],
                routeWhileDragging: false, show: false, addWaypoints: false,
                showAlternatives: true, 
                lineOptions: { styles: [{color: 'white', opacity: 0.8, weight: 12}, {color: currentTab === 'tram' ? '#198754' : '#0dcaf0', opacity: 1, weight: 6}] },
                altLineOptions: { styles: [{color: 'white', opacity: 0.8, weight: 12}, {color: '#fd7e14', opacity: 0.8, weight: 5}] },
                createMarker: () => null 
            }).addTo(map);
            
            map.closePopup();
        }

        function openGoogleMaps() {
            if (!selectedItem || !userLat || !userLon) return;
            const url = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${selectedItem.lat},${selectedItem.lon}&travelmode=driving`;
            window.open(url, '_blank');
        }

        function batDauSac() {
            if(!selectedItem || currentTab !== 'tram') return;
            isCharging = true; elapsedSeconds = 0;
            document.getElementById('info-panel').style.display = 'none';
            document.getElementById('charging-panel').style.display = 'block';
            startTime = new Date();
            
            map.closePopup(); 
            
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                let h = Math.floor(elapsedSeconds / 3600).toString().padStart(2, '0');
                let m = Math.floor((elapsedSeconds % 3600) / 60).toString().padStart(2, '0');
                let s = (elapsedSeconds % 60).toString().padStart(2, '0');
                document.getElementById('charge-timer').textContent = `${h}:${m}:${s}`;
            }, 1000); 
        }

        // ĐÃ BỔ SUNG: KẾT NỐI API ĐỂ LƯU DATABASE PHIÊN SẠC
        function ketThucSac() {
            clearInterval(timerInterval);
            isCharging = false;
            document.getElementById('charging-panel').style.display = 'none';
            document.getElementById('info-panel').style.display = 'block';

            let phut = Math.max(1, Math.floor(elapsedSeconds / 60)); 
            let tien = phut * 3500; 

            document.getElementById('bill-time').textContent = phut + " phút";
            document.getElementById('bill-total').textContent = tien.toLocaleString('vi-VN') + " VNĐ";
            
            new bootstrap.Modal(document.getElementById('ratingModal')).show();

            // Gói dữ liệu gửi về Django
            let payload = {
                tram_id: selectedItem.id,
                thoi_gian_bat_dau: startTime.toISOString(),
                thoi_gian_ket_thuc: new Date().toISOString(),
                tong_thoi_gian: phut,
                tong_tien: tien
            };

            // Gọi API lưu Phiên sạc
            fetch("{% url 'ket_thuc_sac_api' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    console.log("Hệ thống: " + data.message);
                } else {
                    alert("Lưu ý: " + data.message); // Báo lỗi nếu khách chưa đăng nhập
                }
            })
            .catch(e => console.log("Gửi API lưu phiên sạc thất bại", e));
        }

        function guiDanhGia() {
            alert("Đã ghi nhận đánh giá " + document.getElementById('station-rating').value + " sao. Cảm ơn bạn!");
        }

        // HÀM LẤY COOKIE BẢO MẬT CỦA DJANGO ĐỂ CHO PHÉP GỬI DỮ LIỆU
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
