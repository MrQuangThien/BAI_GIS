<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | EV Store Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #198754 0%, #212529 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        .login-header {
            background: #198754;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .btn-success { background-color: #198754; border: none; }
        .btn-success:hover { background-color: #157347; }
        .form-control:focus { border-color: #198754; box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h2 class="fw-bold mb-0"><i class="bi bi-lightning-charge-fill"></i> EV STORE</h2>
        <p class="small opacity-75 mt-2 mb-0">Hệ Thống Quản Trị Nội Bộ</p>
    </div>
    
    <div class="card-body p-4">
        {% if form.errors %}
            <div class="alert alert-danger small py-2">
                <i class="bi bi-exclamation-circle me-2"></i> Sai tài khoản hoặc mật khẩu!
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">TÊN ĐĂNG NHẬP</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Nhập username..." required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">MẬT KHẨU</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">
                ĐĂNG NHẬP NGAY
            </button>
        </form>
    </div>
    <div class="card-footer bg-light border-0 text-center py-3">
        <small class="text-muted">© 2026 EV Store Team</small>
    </div>
</div>

</body>
</html>
