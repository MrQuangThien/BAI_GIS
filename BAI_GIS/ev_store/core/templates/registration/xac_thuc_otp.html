<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Email | EV Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { 
            background: linear-gradient(135deg, #198754 0%, #212529 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
        }
        .auth-card { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            width: 100%; 
            max-width: 400px; 
            overflow: hidden; 
        }
        .auth-header { 
            background: #198754; 
            color: white; 
            padding: 25px 20px; 
            text-align: center; 
        }
        .otp-input {
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <h4 class="fw-bold mb-0"><i class="bi bi-shield-lock-fill me-2"></i>XÁC THỰC EMAIL</h4>
    </div>
    
    <div class="card-body p-4 text-center">
        <p class="text-muted small mb-4">Chúng tôi vừa gửi một mã OTP gồm 6 chữ số vào địa chỉ email bạn đã đăng ký. Vui lòng kiểm tra hộp thư (hoặc thư rác) và nhập mã vào bên dưới.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger small py-2 fw-bold" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <input type="text" name="otp" class="form-control otp-input py-2" placeholder="------" maxlength="6" required autocomplete="off">
            </div>
            
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">
                XÁC NHẬN TÀI KHOẢN
            </button>
        </form>
        
        <div class="mt-3">
            <a href="{% url 'register' %}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng ký</a>
        </div>
    </div>
</div>

</body>
</html>
